name: Release Build

on:
  workflow_dispatch:
    inputs:
      build_all:
        description: Build all platforms
        type: boolean
        default: true
      build_android:
        description: Build Android APK
        type: boolean
        default: false
      build_windows:
        description: Build Windows zip
        type: boolean
        default: false
      build_linux_tar_x64:
        description: Build Linux x64 tar.gz
        type: boolean
        default: false
      build_linux_tar_arm64:
        description: Build Linux arm64 tar.gz
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.0"
  APK_BUILD_DIR: "/tmp/build"

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_apk:
    needs: build
    if: ${{ inputs.build_all || inputs.build_android }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Copy files to env.APK_BUILD_DIR
        run: |
          mkdir -p $APK_BUILD_DIR
          cp -r . $APK_BUILD_DIR

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter build apk --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: apk-result
          path: |
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-release.apk

  build_tar_x86_64:
    needs: build
    if: ${{ inputs.build_all || inputs.build_linux_tar_x64 }}
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Compile linux
        working-directory: app
        run: flutter build linux

      - name: Create tar.gz archive
        run: |
          cd app/build/linux/x64/release/bundle
          tar -czvf ../../../../../result.tar.gz *

      - name: Upload tar.gz archive
        uses: actions/upload-artifact@v6
        with:
          name: tar-gz-x86-64-result
          path: ./app/*.tar.gz

  # Manage the Flutter version on the self-hosted runner manually!
  # Flutter currently doesn't provide Linux ARM64 binaries.
  build_tar_arm_64:
    needs: build
    if: ${{ inputs.build_all || inputs.build_linux_tar_arm64 }}
    runs-on: [ self-hosted, linux, arm64 ]

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Compile linux
        working-directory: app
        run: flutter build linux

      - name: Create tar.gz archive
        run: |
          cd app/build/linux/arm64/release/bundle
          tar -czvf ../../../../../result.tar.gz *

      - name: Upload tar.gz archive
        uses: actions/upload-artifact@v6
        with:
          name: tar-gz-arm-64-result
          path: ./app/*.tar.gz

  build_windows_zip_x86_64:
    needs: build
    if: ${{ inputs.build_all || inputs.build_windows }}
    runs-on: windows-2022

    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Node.js for Agent Worker
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"
          cache-dependency-path: scripts/agent_dispatch/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build MSIX helper package
        run: .\scripts\compile_windows_msix_helper.ps1

      - name: Compile for Windows
        working-directory: app
        run: flutter build windows

      - name: Create empty settings.json
        working-directory: app
        run: echo {} > build/windows/x64/runner/Release/settings.json

      - name: Add DLL files
        working-directory: app
        run: |
          Copy-Item ../scripts/windows/x64/msvcp140.dll build/windows/x64/runner/Release/
          Copy-Item ../scripts/windows/x64/vcruntime140.dll build/windows/x64/runner/Release/
          Copy-Item ../scripts/windows/x64/vcruntime140_1.dll build/windows/x64/runner/Release/

      - name: Test Agent Worker on Windows
        working-directory: scripts/agent_dispatch
        run: |
          npm ci
          npm test

      - name: Package self-contained Agent Worker
        run: >
          .\scripts\package_agent_worker_windows.ps1
          -Destination .\app\build\windows\x64\runner\Release\agent_worker

      - name: Zip compiled files
        working-directory: app
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Kanban.zip

      - name: Upload zip
        uses: actions/upload-artifact@v6
        with:
          name: windows-zip-x86-64-result
          path: app/Kanban.zip

  upload_android:
    needs: [build, build_apk]
    if: ${{ (inputs.build_all || inputs.build_android) && needs.build_apk.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: apk-result
          path: apk-result

      - name: Upload Android APKs to release
        uses: ./.github/actions/publish-release-asset
        with:
          tag: v${{ needs.build.outputs.version }}
          draft: "false"
          assets: |
            apk-result/app-release.apk#Kanban-${{ needs.build.outputs.version }}-android-arm64v8.apk

  upload_linux_tar_x64:
    needs: [build, build_tar_x86_64]
    if: ${{ (inputs.build_all || inputs.build_linux_tar_x64) && needs.build_tar_x86_64.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: tar-gz-x86-64-result
          path: tar-gz-x86-64-result

      - name: Prepare tar.gz asset
        run: |
          mkdir -p upload
          cp tar-gz-x86-64-result/* upload/linux-x86-64.tar.gz
        shell: bash

      - name: Upload Linux x64 tar.gz to release
        uses: ./.github/actions/publish-release-asset
        with:
          tag: v${{ needs.build.outputs.version }}
          assets: upload/linux-x86-64.tar.gz#Kanban-${{ needs.build.outputs.version }}-linux-x86-64.tar.gz

  upload_linux_tar_arm64:
    needs: [build, build_tar_arm_64]
    if: ${{ (inputs.build_all || inputs.build_linux_tar_arm64) && needs.build_tar_arm_64.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: tar-gz-arm-64-result
          path: tar-gz-arm-64-result

      - name: Prepare tar.gz asset
        run: |
          mkdir -p upload
          cp tar-gz-arm-64-result/* upload/linux-arm-64.tar.gz
        shell: bash

      - name: Upload Linux arm64 tar.gz to release
        uses: ./.github/actions/publish-release-asset
        with:
          tag: v${{ needs.build.outputs.version }}
          assets: upload/linux-arm-64.tar.gz#Kanban-${{ needs.build.outputs.version }}-linux-arm-64.tar.gz

  upload_windows:
    needs: [build, build_windows_zip_x86_64]
    if: ${{ (inputs.build_all || inputs.build_windows) && needs.build_windows_zip_x86_64.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: windows-zip-x86-64-result
          path: windows-zip-x86-64-result

      - name: Upload Windows zip to release
        uses: ./.github/actions/publish-release-asset
        with:
          tag: v${{ needs.build.outputs.version }}
          assets: windows-zip-x86-64-result/Kanban.zip#Kanban-${{ needs.build.outputs.version }}-windows-x86-64.zip
